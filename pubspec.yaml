name: cetisafe
description: "App de control de asistencia escolar para CETIS 131"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - base de datos y autenticación
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1

  # QR - generar y escanear
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Notificaciones locales
  flutter_local_notifications: ^17.2.2

  # Manejo de estado
  provider: ^6.1.2

  # PDF - generar reportes
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.3

  # Splash screen
  flutter_native_splash: ^2.4.1

  # Íconos y UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Utilidades
  intl: ^0.19.0
  shared_preferences: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/icon_app.jpeg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/icon_app.jpeg"